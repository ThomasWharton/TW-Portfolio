{% extends "dashboard_base.html" %}

{% load crispy_forms_tags %}

{% block content %}
<div class="container d-flex justify-content-center">
    <div class="row form-row">
        <h2 class="heading text-center">Edit Article</h2>
        <div class="col-md-5">
            <form method="POST" class="form">
                {% csrf_token %}
                <div class="col text-left">
                    {{ article_form|crispy }}
                    <button type="submit" class="btn btn-primary">Edit</button>
                </div>
            </form>
        </div>
        <div class="col-md-5">
            {% for a in articles %}
                <div class="project-select-col">
                    <a
                        href="{% url 'edit-article' a.id %}"
                        class="form-a btn project-select-btn"
                    >
                        {{ a.title }}
                    </a>
                </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
