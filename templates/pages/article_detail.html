{% extends "base.html" %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-9">
            <a href="{% url 'home' %}#articles" class="btn btn-outline-secondary mb-4">&larr; Back to Articles</a>
            <h1 class="heading mb-2">{{ article.title }}</h1>
            <p class="text-muted mb-4"><small>Published: {{ article.published_date }}</small></p>
            {% if article.summary %}
            <p class="lead mb-4">{{ article.summary }}</p>
            {% endif %}
            <hr>
            <div class="article-content mt-4">
                {{ article.content|linebreaks }}
            </div>
        </div>
    </div>
</div>
{% endblock %}
